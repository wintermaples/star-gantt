<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarGantt v2 — Conditional formatting example</title>
  <!--
    Demonstrates the conditional-format rule engine: a custom rule matching `meta.category`, the
    built-in overdue warning, the built-in progress-status coloring, and the bottom-right legend.

    Conditional formatting is a nested config group on tree-grid (`treeGrid.conditionalFormat`,
    see docs/specs/plugins/tree-grid.md), with rule/priorityColors/overdue/progress/legend
    fields. The timeline origin nests under `view.timeline.origin`. There is no page chrome or
    controls beyond the chart itself, so this page stays a static (no-JS-UI) demonstration.
  -->
<link rel="stylesheet" href="examples.css">
  
</head>
<body class="ex-body">
  <div class="ex-page">
  <h1 class="ex-title">StarGantt v2 — conditional formatting</h1>
  <div id="chart" class="ex-chart"></div>
  </div>

  <script src="../packages/stargantt/dist/stargantt.iife.js"></script>
  <script>
    const DAY = 86400000;
    // Anchor the data at today 0:00 UTC — the default time-axis origin — so the chart opens on
    // the data.
    const T0 = Math.floor(Date.now() / DAY) * DAY;

    function dataset() {
      return {
        tasks: [
          { id: "root", parentId: null, name: "Release", type: "summary", start: T0 - 6 * DAY, end: T0 + 14 * DAY },
          // Overdue: ended two days ago with progress below 1 — gets the warning color + icon.
          { id: "spec", parentId: "root", name: "Design review", start: T0 - 6 * DAY, end: T0 - 2 * DAY, progress: 0.4 },
          { id: "impl", parentId: "root", name: "Implementation", start: T0 - 4 * DAY, end: T0 + 6 * DAY, progress: 0.5 },
          // Colored by the QA rule through its meta.category value.
          { id: "qa1", parentId: "root", name: "Integration tests", start: T0 + 2 * DAY, end: T0 + 9 * DAY, meta: { category: "qa" } },
          { id: "qa2", parentId: "root", name: "Acceptance tests", start: T0 + 6 * DAY, end: T0 + 12 * DAY, meta: { category: "qa" } },
          { id: "done", parentId: "root", name: "Docs", start: T0 - 6 * DAY, end: T0 - 3 * DAY, progress: 1 },
          { id: "ship", parentId: "root", name: "Ship", type: "milestone", start: T0 + 14 * DAY, end: T0 + 14 * DAY },
        ],
      };
    }

    const gantt = StarGantt.create({
      element: document.getElementById("chart"),
      plugins: StarGantt.presetStandard({
        // "spec" and "done" both start at `T0 - 6 * DAY`, before the default today-anchored
        // origin — without this, that content sits left of content x = 0 and no scroll gesture
        // can reach it.
        view: { timeline: { origin: T0 - 6 * DAY } },
        treeGrid: {
          conditionalFormat: {
            rules: [
              {
                when: { field: "meta.category", op: "eq", value: "qa" },
                style: { color: "rgb(190, 24, 220)" },
                legend: "QA tasks",
              },
            ],
            overdue: true,
            progress: true,
            legend: true,
          },
        },
      }),
    });

    gantt.service("stargantt.data").load(dataset());
    window.gantt = gantt;
  </script>
</body>
</html>
