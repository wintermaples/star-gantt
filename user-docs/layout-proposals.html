<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarGantt User Docs — Layout Proposals</title>
<style>
/* ------------------------------------------------------------------
   Design tokens. 8px spacing grid, 12px text floor, WCAG AA contrast.
   Viewport assumption: >= 720x540 (tablet or wider). No phone layouts.
   ------------------------------------------------------------------ */
:root {
  --bg: #ffffff;
  --bg-sunken: #f4f6f9;
  --bg-raised: #ffffff;
  --bg-code: #f6f8fa;
  --fg: #14181f;          /* 15.9:1 on --bg */
  --fg-muted: #5b6675;    /* 5.4:1  on --bg */
  --fg-faint: #7d879a;    /* 3.9:1  on --bg, non-text only */
  --line: #dde2e9;
  --line-strong: #c3cad4;
  --accent: #2f5fd0;      /* 5.8:1 on --bg */
  --accent-soft: #e8eefc;
  --bar: #4a7de0;
  --bar-summary: #2b3a55;
  --bar-critical: #c0392b;
  --bar-done: #3f9668;
  --today: #d9534f;
  --weekend: #eef1f5;
  --warn-bg: #fff6e5;
  --warn-fg: #7a5200;
  --ok-bg: #e8f6ee;
  --ok-fg: #1c6b46;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 12px rgba(16, 24, 40, .06);
  --row-h: 28px;          /* dense */
  --row-h-comfy: 34px;    /* comfortable */
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151c;
    --bg-sunken: #0c0f15;
    --bg-raised: #171c25;
    --bg-code: #0e1219;
    --fg: #e7ecf3;
    --fg-muted: #a3aebd;
    --fg-faint: #7d879a;
    --line: #262d3a;
    --line-strong: #38414f;
    --accent: #7ea6ff;
    --accent-soft: #1b2740;
    --bar: #5b8cf0;
    --bar-summary: #93a4c4;
    --bar-critical: #e06a5c;
    --bar-done: #4fb083;
    --today: #ef6b66;
    --weekend: #171c25;
    --warn-bg: #33280f;
    --warn-fg: #f0cf8a;
    --ok-bg: #12291f;
    --ok-fg: #8fdcb4;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 14px/1.5 var(--sans);
  color: var(--fg);
  background: var(--bg-sunken);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.3; }
p { margin: 0 0 8px; }
code, pre { font-family: var(--mono); }

/* ---------------- App chrome (the proposal switcher itself) -------- */
.app { display: flex; flex-direction: column; min-height: 100%; }
.appbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg-raised);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px 0;
}
.appbar-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.appbar-top h1 { font-size: 15px; letter-spacing: .01em; }
.appbar-top .sub { font-size: 12px; color: var(--fg-muted); }
.appbar-top .spacer { flex: 1; }
.tabs {
  display: flex; gap: 4px; overflow-x: auto; padding: 10px 0 0;
  scrollbar-width: thin;
}
.tab {
  appearance: none; border: 1px solid transparent; background: none;
  color: var(--fg-muted); font: inherit; font-size: 12px;
  padding: 8px 12px; min-height: 32px; border-radius: var(--radius) var(--radius) 0 0;
  cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px;
}
.tab:hover { background: var(--bg-sunken); color: var(--fg); }
.tab[aria-selected="true"] {
  color: var(--fg); background: var(--bg-sunken);
  border-color: var(--line); border-bottom-color: var(--bg-sunken);
  font-weight: 600;
  margin-bottom: -1px;
}
.tab .n {
  font-variant-numeric: tabular-nums; font-size: 11px;
  background: var(--line); color: var(--fg-muted);
  border-radius: 4px; padding: 1px 5px; min-width: 20px; text-align: center;
}
.tab[aria-selected="true"] .n { background: var(--accent); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.toolbar { display: flex; gap: 8px; align-items: center; }
.btn {
  appearance: none; font: inherit; font-size: 12px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--bg-raised); color: var(--fg);
  border-radius: var(--radius); padding: 6px 10px; min-height: 28px;
}
.btn:hover { background: var(--bg-sunken); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------------- Stage (holds one proposal) ---------------------- */
.stage { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.stage-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.stage-head h2 { font-size: 18px; }
.stage-head .lede { font-size: 13px; color: var(--fg-muted); max-width: 68ch; margin-top: 4px; }

.scores { display: flex; gap: 6px; flex-wrap: wrap; }
.score {
  font-size: 11px; border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 9px; background: var(--bg-raised); color: var(--fg-muted);
  display: flex; align-items: center; gap: 5px;
}
.score b { font-weight: 700; font-size: 12px; }
.score.g { background: var(--ok-bg); color: var(--ok-fg); border-color: transparent; }
.score.y { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }

.frame {
  border: 1px solid var(--line-strong); border-radius: var(--radius-lg);
  background: var(--bg); overflow: hidden; box-shadow: var(--shadow);
  height: 620px; display: flex; flex-direction: column; resize: vertical;
}
.frame.min { width: 720px; height: 540px; }
.frame-note {
  font-size: 11px; color: var(--fg-muted);
  display: flex; gap: 10px; align-items: center;
}
.mock { flex: 1; min-height: 0; display: flex; flex-direction: column; font-size: 13px; }

/* ---------------- Generic docs-site primitives -------------------- */
.topnav {
  height: 44px; flex: 0 0 44px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; padding: 0 12px;
  background: var(--bg-raised);
}
.brand { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.topnav .search {
  flex: 1; max-width: 280px; height: 28px; border: 1px solid var(--line-strong);
  border-radius: var(--radius); background: var(--bg-sunken); color: var(--fg-faint);
  font-size: 12px; display: flex; align-items: center; padding: 0 8px; gap: 6px;
}
.topnav .links { display: flex; gap: 14px; font-size: 12px; color: var(--fg-muted); margin-left: auto; }

.sidebar {
  width: 216px; flex: 0 0 216px; border-right: 1px solid var(--line);
  overflow: auto; padding: 12px 8px; background: var(--bg-raised);
}
.sidebar.wide { width: 248px; flex-basis: 248px; }
.nav-group { margin-bottom: 12px; }
.nav-title {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--fg-faint); padding: 4px 8px; font-weight: 700;
}
.nav-item {
  display: flex; align-items: center; gap: 6px; font-size: 12px;
  padding: 5px 8px; border-radius: 5px; color: var(--fg-muted); cursor: default;
  min-height: 24px;
}
.nav-item.child { padding-left: 20px; }
.nav-item.gchild { padding-left: 32px; font-size: 11.5px; }
.nav-item:hover { background: var(--bg-sunken); color: var(--fg); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item .tag {
  margin-left: auto; font-size: 9.5px; padding: 1px 5px; border-radius: 3px;
  background: var(--line); color: var(--fg-muted); font-weight: 600; letter-spacing: .03em;
}
.nav-item .tag.auto { background: var(--accent-soft); color: var(--accent); }

.content { flex: 1; min-width: 0; overflow: auto; padding: 20px 28px 40px; }
.content h3 { font-size: 20px; margin-bottom: 6px; }
.content h4 { font-size: 14px; margin: 20px 0 6px; }
.content p { font-size: 13px; color: var(--fg-muted); max-width: 72ch; }
.crumb { font-size: 11.5px; color: var(--fg-faint); margin-bottom: 6px; }

.toc {
  width: 184px; flex: 0 0 184px; border-left: 1px solid var(--line);
  padding: 20px 12px; overflow: auto; font-size: 11.5px; background: var(--bg);
}
.toc .nav-title { padding-left: 0; }
.toc a { display: block; color: var(--fg-muted); text-decoration: none; padding: 3px 0 3px 8px; border-left: 2px solid transparent; }
.toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.pill {
  display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px;
  padding: 2px 7px; border-radius: 999px; font-weight: 600; letter-spacing: .02em;
}
.pill.auto { background: var(--accent-soft); color: var(--accent); }
.pill.hand { background: var(--warn-bg); color: var(--warn-fg); }
.pill.core { background: var(--ok-bg); color: var(--ok-fg); }
.pill.type { background: var(--bg-code); color: var(--fg-muted); font-family: var(--mono); font-weight: 500; }

.card {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg-raised); overflow: hidden;
}
.card-head {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border-bottom: 1px solid var(--line); background: var(--bg-sunken);
  font-size: 12px; font-weight: 600;
}
.card-head .spacer { flex: 1; }
.card-body { padding: 10px; }

.propname { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--fg); }
.propmeta { font-size: 11px; color: var(--fg-muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* code block */
.code {
  background: var(--bg-code); border: 1px solid var(--line); border-radius: var(--radius);
  font-size: 11.5px; line-height: 1.55; padding: 8px 10px; overflow: auto; margin: 0;
  color: var(--fg);
}
.code .k { color: #b06500; } .code .s { color: #1c7c4a; } .code .n { color: #7c3aad; }
.code .c { color: var(--fg-faint); font-style: italic; } .code .p { color: var(--fg-muted); }
@media (prefers-color-scheme: dark) {
  .code .k { color: #e0a05c; } .code .s { color: #7fd3a2; } .code .n { color: #c69bef; }
}
.code-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); background: var(--bg-sunken); }
.code-tab { font-size: 11px; padding: 5px 10px; color: var(--fg-muted); border-bottom: 2px solid transparent; }
.code-tab.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; background: var(--bg-code); }

/* segmented control used for "value pickers" under a property */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.seg span {
  font-size: 11px; padding: 4px 9px; min-height: 24px; display: flex; align-items: center;
  color: var(--fg-muted); border-right: 1px solid var(--line);
  font-family: var(--mono);
}
.seg span:last-child { border-right: 0; }
.seg span.on { background: var(--accent); color: #fff; font-weight: 600; }

.api-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.api-table th, .api-table td {
  text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top;
}
.api-table th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-faint); }
.api-table td.mono { font-family: var(--mono); font-size: 11.5px; }
.api-table td.desc { color: var(--fg-muted); }

/* ---------------- Fake gantt chart component ---------------------- */
.gantt {
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  background: var(--bg); display: flex; flex-direction: column; font-size: 11px;
}
.gantt-toolbar {
  display: flex; align-items: center; gap: 6px; padding: 4px 6px;
  border-bottom: 1px solid var(--line); background: var(--bg-sunken); font-size: 10.5px;
  color: var(--fg-muted);
}
.gantt-toolbar .g-btn {
  border: 1px solid var(--line-strong); border-radius: 4px; padding: 2px 6px;
  background: var(--bg-raised); min-height: 20px; display: flex; align-items: center;
}
.gantt-body { display: flex; min-height: 0; flex: 1; }
.g-grid { flex: 0 0 var(--gridw, 150px); border-right: 1px solid var(--line-strong); overflow: hidden; }
.g-chart { flex: 1; position: relative; overflow: hidden; }
.g-head {
  height: 34px; border-bottom: 1px solid var(--line-strong); display: flex;
  background: var(--bg-sunken); font-size: 10px; color: var(--fg-muted);
}
.g-head .g-h-cell { flex: 1; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.g-head .g-h-top { flex: 1; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); font-weight: 600; }
.g-head .g-h-sub { flex: 1; display: flex; }
.g-head .g-h-sub i { flex: 1; display: flex; align-items: center; justify-content: center; font-style: normal; border-right: 1px solid var(--line); font-size: 9px; }
.g-grid .g-head { padding: 0 8px; align-items: center; font-weight: 600; }
.g-row {
  height: var(--rh, 26px); display: flex; align-items: center;
  border-bottom: 1px solid var(--line); padding: 0 8px; gap: 5px;
  white-space: nowrap; overflow: hidden; color: var(--fg);
}
.g-row .caret { color: var(--fg-faint); width: 10px; }
.g-row .ind { display: inline-block; }
.g-row.sum { font-weight: 600; }
.g-lane { height: var(--rh, 26px); border-bottom: 1px solid var(--line); position: relative; }
.g-bar {
  position: absolute; top: 50%; transform: translateY(-50%);
  height: calc(var(--rh, 26px) - 12px); min-height: 12px;
  background: var(--bar); border-radius: var(--br, 3px);
  color: #fff; font-size: 9.5px; display: flex; align-items: center;
  padding: 0 5px; overflow: hidden;
}
.g-bar.sum { background: var(--bar-summary); height: 8px; border-radius: 2px; }
.g-bar.crit { background: var(--bar-critical); }
.g-bar.done { background: var(--bar-done); }
.g-bar .prog { position: absolute; inset: 0 auto 0 0; background: rgba(255,255,255,.34); }
.g-ms {
  position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px;
  background: var(--bar-summary); transform: rotate(45deg);
}
.g-weekend { position: absolute; top: 0; bottom: 0; background: var(--weekend); }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--today); }
.g-vline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .8; }
.g-dep { position: absolute; border-left: 1.5px solid var(--fg-faint); border-top: 1.5px solid var(--fg-faint); }
.g-lanes { position: absolute; inset: 34px 0 0 0; }
.g-layers { position: absolute; inset: 34px 0 0 0; pointer-events: none; }

.dim { opacity: .55; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; }
.grow { flex: 1; min-width: 0; }

/* per-layout helpers */
.sticky-preview { position: sticky; top: 0; }
.section-rule { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.badge-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0 10px; }
.callout {
  border-left: 3px solid var(--accent); background: var(--accent-soft);
  padding: 8px 10px; border-radius: 0 var(--radius) var(--radius) 0; font-size: 12px; color: var(--fg);
}
.callout.warn { border-left-color: var(--warn-fg); background: var(--warn-bg); color: var(--warn-fg); }
.legend { display: flex; gap: 12px; font-size: 10.5px; color: var(--fg-muted); align-items: center; flex-wrap: wrap; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }

.notes {
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 12px 16px; font-size: 12.5px;
}
.notes h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-faint); margin-bottom: 6px; }
.notes ul { margin: 0 0 10px; padding-left: 18px; color: var(--fg-muted); }
.notes li { margin-bottom: 3px; }
.notes .two { display: flex; gap: 24px; flex-wrap: wrap; }
.notes .two > div { flex: 1; min-width: 260px; }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="appbar-top">
      <h1>StarGantt · User Docs — Layout Proposals</h1>
      <span class="sub">10 candidates · pick one (or a hybrid) before locking the docs constraints</span>
      <span class="spacer"></span>
      <div class="toolbar">
        <button class="btn" id="minvp" aria-pressed="false" title="Clamp the frame to the minimum supported viewport">720×540</button>
        <button class="btn" id="prev" title="Previous proposal (←)">←</button>
        <button class="btn" id="next" title="Next proposal (→)">→</button>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </header>

  <main class="stage">
    <div class="stage-head">
      <div class="grow">
        <h2 id="p-title"></h2>
        <p class="lede" id="p-lede"></p>
      </div>
      <div class="scores" id="p-scores"></div>
    </div>
    <div class="frame-note">
      <span id="p-vp">Frame: fluid width × 620px — drag the bottom edge to resize.</span>
      <span class="legend">
        <span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>auto-generated region</span>
        <span><i style="background:var(--warn-bg);border:1px solid var(--warn-fg)"></i>hand-written prose</span>
      </span>
    </div>
    <div class="frame" id="frame"><div class="mock" id="mock"></div></div>
    <div class="notes" id="p-notes"></div>
  </main>
</div>

<script>
/* ==================================================================
   Tiny helpers for building the mockups.
   ================================================================== */
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
};

/* Naive TS/JS colorizer for the mock code blocks.
   Single pass with alternation — a multi-pass replace would re-match the
   class names of the spans emitted by the earlier passes. */
const KEYWORDS = /^(import|from|export|const|let|new|function|return|await|async|type|interface|true|false|null|undefined)$/;
function code(src, cls) {
  const esc = (s) => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const html = src.replace(
    /(\/\/[^\n]*)|('[^'\n]*'|"[^"\n]*"|`[^`]*`)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_$][\w$]*\b)/g,
    (m, comment, str, num, word) => {
      if (comment) return `<span class="c">${esc(comment)}</span>`;
      if (str) return `<span class="s">${esc(str)}</span>`;
      if (num) return `<span class="n">${num}</span>`;
      if (word && KEYWORDS.test(word)) return `<span class="k">${word}</span>`;
      return esc(m);
    },
  );
  return h('pre', { class: 'code ' + (cls || ''), html });
}

/* ------------------------------------------------------------------
   Fake gantt chart. Not the real library — a faithful-enough wireframe
   so each layout shows real information density.
   ------------------------------------------------------------------ */
const DEFAULT_ROWS = [
  { name: 'Release 1.4', lvl: 0, sum: true, from: 2, to: 92, caret: '▾' },
  { name: 'Design', lvl: 1, sum: true, from: 4, to: 34, caret: '▾' },
  { name: 'Wireframes', lvl: 2, from: 4, to: 20, prog: 100, done: true },
  { name: 'Visual spec', lvl: 2, from: 18, to: 34, prog: 60 },
  { name: 'Build', lvl: 1, sum: true, from: 32, to: 78, caret: '▾' },
  { name: 'Core kernel', lvl: 2, from: 32, to: 52, prog: 80 },
  { name: 'Renderer', lvl: 2, from: 48, to: 70, prog: 25, crit: true },
  { name: 'Plugins', lvl: 2, from: 56, to: 78, prog: 0 },
  { name: 'Ship', lvl: 1, ms: 90 },
];

function gantt(opt = {}) {
  const o = Object.assign({
    rows: DEFAULT_ROWS, rowH: 26, gridW: 150, radius: 3, weekend: true,
    today: 62, deps: true, toolbar: false, labels: true, grid: true,
    cols: ['Task'], head: ['Jan', 'Feb', 'Mar'], subs: 4, vlines: true, height: null,
  }, opt);

  const gridRows = o.rows.map(r => h('div', { class: 'g-row' + (r.sum ? ' sum' : '') },
    h('span', { class: 'ind', style: { width: (r.lvl * 10) + 'px' } }),
    h('span', { class: 'caret' }, r.caret || ''),
    h('span', { style: { overflow: 'hidden', textOverflow: 'ellipsis' } }, r.name),
  ));

  const lanes = o.rows.map(r => {
    const lane = h('div', { class: 'g-lane' });
    if (r.ms != null) {
      lane.append(h('div', { class: 'g-ms', style: { left: r.ms + '%' } }));
    } else if (r.from != null) {
      const bar = h('div', {
        class: 'g-bar' + (r.sum ? ' sum' : '') + (r.crit ? ' crit' : '') + (r.done ? ' done' : ''),
        style: { left: r.from + '%', width: (r.to - r.from) + '%', '--br': o.radius + 'px' },
      });
      if (r.prog) bar.append(h('div', { class: 'prog', style: { width: r.prog + '%' } }));
      if (o.labels && !r.sum && (r.to - r.from) > 14) bar.append(h('span', {}, r.name));
      lane.append(bar);
    }
    return lane;
  });

  const layers = h('div', { class: 'g-layers' });
  if (o.weekend) [12, 26, 40, 54, 68, 82, 96].forEach(x =>
    layers.append(h('div', { class: 'g-weekend', style: { left: x + '%', width: '4%' } })));
  if (o.vlines) [0, 12.5, 25, 37.5, 50, 62.5, 75, 87.5].forEach(x =>
    layers.append(h('div', { class: 'g-vline', style: { left: x + '%' } })));
  if (o.today != null) layers.append(h('div', { class: 'g-today', style: { left: o.today + '%' } }));
  if (o.deps) {
    const rh = o.rowH;
    layers.append(h('div', { class: 'g-dep', style: { left: '52%', top: (5 * rh + rh / 2) + 'px', width: '4%', height: rh + 'px' } }));
    layers.append(h('div', { class: 'g-dep', style: { left: '70%', top: (6 * rh + rh / 2) + 'px', width: '4%', height: rh + 'px' } }));
  }

  const head = h('div', { class: 'g-head' }, o.head.map(m => h('div', { class: 'g-h-cell' },
    h('div', { class: 'g-h-top' }, m),
    h('div', { class: 'g-h-sub' }, Array.from({ length: o.subs }, (_, i) => h('i', {}, 'W' + (i + 1)))),
  )));

  const chart = h('div', { class: 'g-chart' }, head, layers,
    h('div', { class: 'g-lanes' }, lanes));

  const body = h('div', { class: 'gantt-body' },
    o.grid ? h('div', { class: 'g-grid' },
      h('div', { class: 'g-head' }, o.cols.join(' · ')), gridRows) : null,
    chart);

  const el = h('div', {
    class: 'gantt',
    style: { '--rh': o.rowH + 'px', '--gridw': o.gridW + 'px', ...(o.height ? { height: o.height } : {}) },
  },
    o.toolbar ? h('div', { class: 'gantt-toolbar' },
      h('span', { class: 'g-btn' }, '＋'), h('span', { class: 'g-btn' }, '↶'), h('span', { class: 'g-btn' }, '↷'),
      h('span', { class: 'g-btn' }, 'Today'), h('span', { class: 'g-btn' }, '−'), h('span', { class: 'g-btn' }, '＋'),
      h('span', { style: { marginLeft: 'auto' } }, '9 tasks · zoom: week')) : null,
    body);
  return el;
}

/* ==================================================================
   Switcher.
   ================================================================== */
const SCORE_LABEL = { core: 'C1 core', api: 'C2 plugin API', gen: 'C3 generated', prose: 'C4 prose', demo: 'C5 live demo' };
const tabsEl = document.getElementById('tabs');
const frameEl = document.getElementById('frame');
let current = 0;

PROPOSALS.forEach((p, i) => {
  const b = h('button', { class: 'tab', role: 'tab', id: 'tab-' + i, 'aria-selected': 'false', type: 'button' },
    h('span', { class: 'n' }, String(i + 1)), h('span', {}, p.name));
  b.addEventListener('click', () => show(i));
  tabsEl.append(b);
});

function show(i) {
  current = ((i % PROPOSALS.length) + PROPOSALS.length) % PROPOSALS.length;
  const p = PROPOSALS[current];
  [...tabsEl.children].forEach((t, j) => t.setAttribute('aria-selected', String(j === current)));
  document.getElementById('p-title').textContent = p.title;
  document.getElementById('p-lede').textContent = p.lede;

  const sc = document.getElementById('p-scores');
  sc.replaceChildren(...Object.entries(p.scores).map(([k, v]) =>
    h('span', { class: 'score ' + (v === 'g' ? 'g' : 'y') }, h('b', {}, v === 'g' ? '◎' : '△'), SCORE_LABEL[k])));

  // Re-query every time: the previous node was detached by the last replaceWith().
  const next = p.build();
  next.id = 'mock';
  document.getElementById('mock').replaceWith(next);

  const n = document.getElementById('p-notes');
  n.replaceChildren(
    h('div', { class: 'two' },
      h('div', {}, h('h4', {}, 'Strengths'), h('ul', {}, p.notes.pros.map(t => h('li', {}, t)))),
      h('div', {}, h('h4', {}, 'Costs / risks'), h('ul', {}, p.notes.cons.map(t => h('li', {}, t))))),
    h('div', { style: { fontSize: '12.5px' } }, h('b', {}, 'Verdict: '), p.notes.fit),
  );
  history.replaceState(null, '', '#' + p.id);
  document.querySelector('.stage').scrollIntoView({ block: 'start', behavior: 'auto' });
}

document.getElementById('prev').addEventListener('click', () => show(current - 1));
document.getElementById('next').addEventListener('click', () => show(current + 1));
document.getElementById('minvp').addEventListener('click', (e) => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  frameEl.classList.toggle('min', on);
  document.getElementById('p-vp').textContent = on
    ? 'Frame: clamped to the minimum supported viewport, 720×540.'
    : 'Frame: fluid width × 620px — drag the bottom edge to resize.';
});
window.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowLeft') show(current - 1);
  if (e.key === 'ArrowRight') show(current + 1);
  if (/^[1-9]$/.test(e.key)) show(Number(e.key) - 1);
  if (e.key === '0') show(9);
});

const start = PROPOSALS.findIndex(p => '#' + p.id === location.hash);
show(start >= 0 ? start : 0);
</script>
